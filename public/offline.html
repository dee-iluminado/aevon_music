<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0c0b" />
    <title>Offline · AEVON Music</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0c0b;
        --fg: #faf9f6;
        --sub: #a8a29a;
        --line: rgba(255, 255, 255, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(120% 90% at 50% 0%, #1c1a17 0%, var(--bg) 55%);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 420px;
      }
      img {
        width: 84px;
        height: 84px;
        object-fit: contain;
        opacity: 0.92;
      }
      h1 {
        margin: 22px 0 10px;
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--sub);
        font-size: 0.925rem;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 26px;
        padding: 12px 26px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.06);
        color: var(--fg);
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        transition: background 160ms ease;
      }
      a:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .hint {
        margin-top: 14px;
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(168, 162, 154, 0.65);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="AEVON Music" />
      <h1>You&rsquo;re offline</h1>
      <p>
        Pages you&rsquo;ve already visited still work, and your downloaded songs
        stay playable. Reconnect to keep streaming.
      </p>
      <a href="/">Try again</a>
      <p class="hint">AEVON Music</p>
    </main>
  </body>
</html>
